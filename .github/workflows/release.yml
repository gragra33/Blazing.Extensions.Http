name: Release

on:
    push:
        branches: [master]

# Skipped when running locally (ci-cd-test-run.ps1 passes --env RUNNING_LOCALLY=true to act).
# On real GitHub Actions RUNNING_LOCALLY is empty → upload steps run; failures are fatal.
env:
    RUNNING_LOCALLY: ""

permissions:
  contents: write

jobs:
    release:
        name: Release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  # Full history required for git ls-remote tag existence check
                  fetch-depth: 0

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  # Install all three SDKs — ref packs for each TFM must be present on disk
                  # so that multi-targeting restore and test execution work correctly.
                  dotnet-version: |
                      8.0.x
                      9.0.x
                      10.0.x

            - name: Restore
              run: dotnet restore Blazing.Extensions.Http.CI.slnf

            - name: Build
              run: dotnet build Blazing.Extensions.Http.CI.slnf --no-restore --configuration Release

            - name: Test (net8.0)
              run: |
                  dotnet test tests/Blazing.Extensions.Http.Tests/Blazing.Extensions.Http.Tests.csproj \
                    --no-build --no-restore \
                    --configuration Release --framework net8.0 \
                    --logger "trx;LogFileName=test-results-net8.0.trx"

            - name: Test (net9.0)
              run: |
                  dotnet test tests/Blazing.Extensions.Http.Tests/Blazing.Extensions.Http.Tests.csproj \
                    --no-build --no-restore \
                    --configuration Release --framework net9.0 \
                    --logger "trx;LogFileName=test-results-net9.0.trx"

            - name: Test (net10.0)
              run: |
                  dotnet test tests/Blazing.Extensions.Http.Tests/Blazing.Extensions.Http.Tests.csproj \
                    --no-build --no-restore \
                    --configuration Release --framework net10.0 \
                    --logger "trx;LogFileName=test-results-net10.0.trx"

            - name: Extract version
              id: version
              run: |
                  VERSION=$(grep -m1 '<Version>' src/Blazing.Extensions.Http/Blazing.Extensions.Http.csproj \
                    | sed 's/.*<Version>//;s/<\/Version>.*//' \
                    | tr -d '[:space:]')

                  if [ -z "$VERSION" ]; then
                    echo "::error::Failed to extract <Version> from src/Blazing.Extensions.Http/Blazing.Extensions.Http.csproj"
                    exit 1
                  fi

                  if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
                    echo "::error::Extracted version '$VERSION' is not in the expected semver format (e.g. 1.2.3, 1.2.3-beta.1, or 1.2.3+build.5)"
                    exit 1
                  fi

                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "tag=v$VERSION" >> $GITHUB_OUTPUT

            - name: Check tag existence
              id: tag_check
              run: |
                  if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
                    echo "exists=true" >> $GITHUB_OUTPUT
                  else
                    echo "exists=false" >> $GITHUB_OUTPUT
                  fi

            - name: Version already tagged
              # Fail fast with a clear error so maintainers know they need to bump
              # <Version> before pushing to master. A silent no-op release is hard to diagnose.
              if: steps.tag_check.outputs.exists == 'true'
              run: |
                  echo "::error::Tag ${{ steps.version.outputs.tag }} already exists. Bump <Version> in Blazing.Extensions.Http.csproj before pushing to master."
                  exit 1

            - name: Pack NuGet packages
              if: steps.tag_check.outputs.exists == 'false'
              run: |
                  dotnet pack src/Blazing.Extensions.Http/Blazing.Extensions.Http.csproj \
                    --no-build --configuration Release --output ./artifacts

            # Push to NuGet.org BEFORE creating the GitHub Release. If the push fails
            # (expired key, transient outage, etc.) the release tag is not yet created,
            # so no orphaned GitHub Release exists without a corresponding NuGet package.
            - name: Push Blazing.Extensions.Http to NuGet.org
              if: steps.tag_check.outputs.exists == 'false'
              run: |
                  dotnet nuget push \
                    "./artifacts/Blazing.Extensions.Http.${{ steps.version.outputs.version }}.nupkg" \
                    --api-key ${{ secrets.NUGET_API_KEY }} \
                    --source https://api.nuget.org/v3/index.json \
                    --skip-duplicate

            - name: Push Blazing.Extensions.Http symbols to NuGet.org
              if: steps.tag_check.outputs.exists == 'false'
              run: |
                  dotnet nuget push \
                    "./artifacts/Blazing.Extensions.Http.${{ steps.version.outputs.version }}.snupkg" \
                    --api-key ${{ secrets.NUGET_API_KEY }} \
                    --source https://api.nuget.org/v3/index.json \
                    --skip-duplicate

            - name: Create GitHub Release
              if: steps.tag_check.outputs.exists == 'false'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "${{ steps.version.outputs.tag }}" \
                    --title "Release ${{ steps.version.outputs.tag }}" \
                    --generate-notes \
                    ./artifacts/*.nupkg \
                    ./artifacts/*.snupkg

            - name: Upload test results
              uses: actions/upload-artifact@v7
              # Skipped locally (RUNNING_LOCALLY=true passed by ci-cd-test-run.ps1).
              # On real GitHub Actions this is empty → step runs and upload failures are fatal.
              if: always() && env.RUNNING_LOCALLY == ''
              with:
                  name: test-results
                  path: "**/*.trx"
