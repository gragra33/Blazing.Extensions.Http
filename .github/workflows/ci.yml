name: CI

on:
    push:
        branches: [develop, "feature/**", "fix/**", "hotfix/**"]
    pull_request:
        branches: [develop, master]

# Skipped when running locally (ci-cd-test-run.ps1 passes --env RUNNING_LOCALLY=true to act).
# On real GitHub Actions RUNNING_LOCALLY is empty → upload steps run; failures are fatal.
env:
    RUNNING_LOCALLY: ""

jobs:
    validate-branch:
        name: Validate Branch Name
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        steps:
            - name: Check branch naming convention
              # Pass github.head_ref via env var — never interpolate context directly into shell
              env:
                  BRANCH: ${{ github.head_ref }}
              run: |
                  if [[ ! "$BRANCH" =~ ^(feature|fix|hotfix)/.+ ]] && [[ "$BRANCH" != "develop" ]]; then
                    echo "::error::Branch '$BRANCH' does not follow naming conventions."
                    echo "::error::PR source branches must be 'develop' or prefixed with 'feature/', 'fix/', or 'hotfix/'."
                    exit 1
                  fi
                  echo "Branch '$BRANCH' follows naming conventions."

    build-and-test:
        name: Build & Test (${{ matrix.framework }})
        needs: validate-branch
        # Run on push events (validate-branch skipped) OR on valid PRs (validate-branch succeeded).
        # always() is required: without it, this job would be skipped on push events where
        # validate-branch is skipped (not 'success').
        if: always() && (needs.validate-branch.result == 'success' || needs.validate-branch.result == 'skipped')
        runs-on: ubuntu-latest
        strategy:
            matrix:
                framework: [net8.0, net9.0, net10.0]

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup .NET
              uses: actions/setup-dotnet@v5
              with:
                  # Install all three SDKs — ref packs for each TFM must be present on disk
                  # so that multi-targeting restore and test execution work correctly.
                  dotnet-version: |
                      8.0.x
                      9.0.x
                      10.0.x

            - name: Restore
              run: dotnet restore Blazing.Extensions.Http.CI.slnf

            - name: Build
              run: dotnet build Blazing.Extensions.Http.CI.slnf --no-restore --configuration Release

            - name: Test (${{ matrix.framework }})
              run: |
                  dotnet test tests/Blazing.Extensions.Http.Tests/Blazing.Extensions.Http.Tests.csproj \
                    --no-build --no-restore \
                    --configuration Release --framework ${{ matrix.framework }} \
                    --logger "trx;LogFileName=test-results-${{ matrix.framework }}.trx"

            - name: Upload test results
              uses: actions/upload-artifact@v7
              # Skipped locally (RUNNING_LOCALLY=true passed by ci-cd-test-run.ps1).
              # On real GitHub Actions this is empty → step runs and upload failures are fatal.
              if: always() && env.RUNNING_LOCALLY == ''
              with:
                  name: test-results-${{ matrix.framework }}
                  path: "**/*.trx"
